{% extends "base.html" %}

{% block title %}Nowe zamówienie{% endblock %}

{% block content %}
<h1 style="margin-bottom: 30px;">Utwórz nowe zamówienie</h1>

{% if errors %}
<div style="color: red;">
    {% for error in errors %}
    <p>{{ error }}</p>
    {% endfor %}
</div>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 20px;">
        <label for="customer_id">Klient:</label>
        <select name="customer_id" id="customer_id" required>
            <option value="">--- Wybierz klienta ---</option>
            {% for customer in customers %}
            <option value="{{ customer.id }}">{{ customer.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <h3>Pozycje zamówienia</h3>
    <div id="items-container">
        <div class="order-item" style="margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
            <label>Pizza:</label>
            <select name="pizza_id" required>
                <option value="">--- Wybierz pizzę ---</option>
                {% for pizza in pizzas %}
                <option value="{{ pizza.id }}">{{ pizza.name }} - {{ pizza.price }} zł</option>
                {% endfor %}
            </select>
            
            <label>Ilość:</label>
            <input type="number" name="quantity" value="1" min="1" required style="width: 60px;">
            
            <button type="button" onclick="removeItem(this)" style="color: #dc3545; background: none; border: none; cursor: pointer; margin-left: 10px;">❌ Usuń</button>
        </div>
    </div>
    <button type="button" id="add-item-btn" style="margin-bottom: 20px; padding: 5px 10px;">+ Dodaj kolejną pozycję</button>
    <br>
    
    <button type="submit">Utwórz zamówienie</button>
</form>

<a href="{% url 'order_list' %}">Powrót do listy</a>

<script>
    document.getElementById('add-item-btn').addEventListener('click', function() {
        var container = document.getElementById('items-container');
        var firstItem = container.querySelector('.order-item');
        
        // Klonujemy pierwszy element na liście
        var newItem = firstItem.cloneNode(true);
        
        // Resetujemy wartości w sklonowanym wierszu
        newItem.querySelector('select').value = '';
        newItem.querySelector('input[type="number"]').value = '1';
        
        // Dodajemy nowy wiersz do formularza
        container.appendChild(newItem);
    });

    function removeItem(button) {
        var container = document.getElementById('items-container');
        // Zabezpieczenie przed usunięciem jedynej pozycji w formularzu
        if (container.querySelectorAll('.order-item').length > 1) {
            button.parentElement.remove();
        } else {
            alert('Zamówienie musi zawierać przynajmniej jedną pozycję.');
        }
    }
</script>
{% endblock %}
